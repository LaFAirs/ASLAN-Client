name: aslan-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build launcher + setup (csc, no extra tools)
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $files = Get-ChildItem apps/launcher -Filter *.cs | Where-Object { $_.Name -ne "AslanSetup.cs" } | ForEach-Object { $_.FullName }
          $refs = @("System.dll","System.Core.dll","System.Drawing.dll","System.Windows.Forms.dll","System.Management.dll","System.Security.dll","System.IO.Compression.dll","System.IO.Compression.FileSystem.dll","System.Xml.dll")
          $refArgs = $refs | ForEach-Object { "/reference:$_" }
          & $csc "/target:winexe" "/out:apps/launcher/AslanLauncher.exe" $refArgs $files
          & $csc "/target:winexe" "/out:apps/launcher/ASLAN-Client-Setup-0.3.0.exe" $refArgs apps/launcher/AslanSetup.cs
      - name: Self-test (in-memory, no AV trip)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/test.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aslan-launcher-0.3.0
          path: |
            releases/AslanLauncher-0.3.0.exe
            releases/ASLAN-Client-Setup-0.3.0.exe

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate mod metadata
        run: |
          python3 -c "import json; d=json.load(open('mods/aslan-client/src/main/resources/fabric.mod.json')); assert d['id']=='aslan-client', d; print('fabric.mod.json OK')"
          test -f mods/aslan-client/src/main/resources/aslan-client.json && echo "mixins OK"
      - name: Build Fabric mod (Loom, Gradle on 25)
        working-directory: mods/aslan-client
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          ./gradlew --no-daemon build
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: aslan-client-mod
          path: mods/aslan-client/build/libs/*.jar

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Next.js site
        working-directory: apps/website/next-src
        run: npm ci && npm run build
      - name: Check static site
        run: |
          test -f apps/website/site/index.html && echo "static site OK"
          python3 -c "import json; d=json.load(open('apps/website/site/release.json')); print('release.json OK', d['version'])"
