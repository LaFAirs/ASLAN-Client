name: aslan-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build launcher + setup (csc, no extra tools)
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $files = Get-ChildItem (Join-Path $root "apps/launcher") -Filter *.cs | Where-Object { $_.Name -ne "AslanSetup.cs" } | ForEach-Object { $_.FullName }
          $refs = @("System.dll","System.Core.dll","System.Drawing.dll","System.Windows.Forms.dll","System.Management.dll","System.Security.dll","System.IO.Compression.dll","System.IO.Compression.FileSystem.dll","System.Xml.dll")
          $refArgs = $refs | ForEach-Object { "/reference:$_" }
          & $csc "/target:winexe" ("/out:" + (Join-Path $root "apps/launcher/AslanLauncher.exe")) $refArgs $files
          & $csc "/target:winexe" ("/out:" + (Join-Path $root "apps/launcher/ASLAN-Client-Setup-0.3.0.exe")) $refArgs (Join-Path $root "apps/launcher/AslanSetup.cs")
      - name: Compile mod core (javac)
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $classes = Join-Path $root "mods/aslan-client/build/classes"
          New-Item -ItemType Directory -Force -Path $classes | Out-Null
          $core = Get-ChildItem (Join-Path $root "mods/aslan-client/src/main/java/gg/aslan/client/core") -Filter *.java | ForEach-Object { $_.FullName }
          & javac -encoding UTF-8 -d $classes $core
          Copy-Item (Join-Path $root "mods/aslan-client/src/main/resources/fabric.mod.json") (Join-Path $classes "fabric.mod.json") -Force
      - name: Stage release files
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path (Join-Path $root "releases") | Out-Null
          Copy-Item (Join-Path $root "apps/launcher/AslanLauncher.exe") (Join-Path $root "releases/AslanLauncher-0.3.0.exe") -Force
          Copy-Item (Join-Path $root "apps/launcher/ASLAN-Client-Setup-0.3.0.exe") (Join-Path $root "releases/ASLAN-Client-Setup-0.3.0.exe") -Force
          Get-ChildItem (Join-Path $root "releases") -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object { "{0}  {1}" -f ((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name) } | Set-Content (Join-Path $root "releases/SHA256SUMS.txt") -Encoding ASCII
      - name: Self-test (in-memory, no AV trip)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/test.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aslan-launcher-0.3.0
          path: |
            releases/AslanLauncher-0.3.0.exe
            releases/ASLAN-Client-Setup-0.3.0.exe

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate mod metadata
        run: |
          python3 -c "import json; d=json.load(open('mods/aslan-client/src/main/resources/fabric.mod.json')); assert d['id']=='aslan-client', d; print('fabric.mod.json OK')"
          test -f mods/aslan-client/src/main/resources/aslan-client.json && echo "mixins OK"
      - name: Build Fabric mod (Loom, Gradle on 25)
        working-directory: mods/aslan-client
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: aslan-client-mod
          path: mods/aslan-client/build/libs/*.jar

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Next.js site
        working-directory: apps/website/next-src
        run: npm install --no-audit --no-fund && npm run build
      - name: Check static site
        run: |
          test -f apps/website/site/index.html && echo "static site OK"
          python3 -c "import json; d=json.load(open('apps/website/site/release.json')); print('release.json OK', d['version'])"
