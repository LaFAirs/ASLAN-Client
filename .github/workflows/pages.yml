name: vyra-pages

on:
  push:
    branches: [main]
    paths: ["apps/website/site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site
        run: |
          test -f apps/website/site/index.html
          test -f apps/website/site/release.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/site
      - id: deployment
        uses: actions/deploy-pages@v4
